name: Aggiornamento archivio stampa
on:
  schedule:
    - cron: '17 5,13,19 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: udc-aggiornamenti-contenuti
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recupera e archivia segnalazioni
        run: python scripts/aggiorna_rassegna.py
      - name: Rigenera cataloghi locali
        run: |
          python -c "import sys,json; sys.path.insert(0, 'scripts'); from aggiorna_notizie import salva_snapshot,OUTPUT; salva_snapshot(json.loads(OUTPUT.read_text(encoding='utf-8')))"
      - name: Salva solo modifiche all'archivio
        run: |
          git add data/stampa.json js/dati-locali.js
          if ! git diff --cached --quiet; then
            git config user.name 'UDC archivio automatico'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Aggiorna archivio storico stampa'
            git push
          fi
