name: Controlli sito
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verifica versionamento risorse (diagnostica)
        run: node scripts/version-assets.mjs --check
        continue-on-error: true
      - run: node scripts/check-site.mjs
      - name: Verifica build pubblica filtrata
        run: python3 scripts/prepara_sito_pubblico.py
      - run: rm -rf _site

      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 --bind 127.0.0.1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/index.html >/dev/null && break; sleep 1; done
          node scripts/browser-check.mjs
