name: Aggiornamento automatico notizie Home

on:
  schedule:
    # GitHub Actions usa UTC; ogni 6 ore. L'esecuzione puo subire ritardi.
    - cron: '43 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Serializza le scritture con il workflow della rassegna stampa.
concurrency:
  group: udc-aggiornamenti-contenuti
  cancel-in-progress: false

jobs:
  aggiorna-home:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recupera notizie e aggiorna i dati locali
        run: python scripts/aggiorna_notizie.py
      - name: Controlla JSON e sintassi del catalogo
        run: |
          python -m json.tool data/web-news.json > /dev/null
          python -m json.tool data/stampa.json > /dev/null
          node --check js/dati-locali.js
      - name: Pubblica soltanto se ci sono modifiche
        run: |
          git add data/web-news.json data/stampa.json js/dati-locali.js
          if ! git diff --cached --quiet; then
            git config user.name 'UDC aggiornamenti automatici'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Aggiorna notizie Home e cataloghi locali'
            git push
          else
            echo 'Nessuna modifica da pubblicare.'
          fi
