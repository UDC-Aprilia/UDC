
name: Recupero storico rassegna stampa
on:
  workflow_dispatch:
    inputs:
      dal:
        description: Data iniziale YYYY-MM-DD
        required: true
        default: '2025-05-01'
      al:
        description: Data finale YYYY-MM-DD
        required: true
        default: '2026-11-22'
permissions:
  contents: write
concurrency:
  group: udc-aggiornamenti-contenuti
  cancel-in-progress: false
jobs:
  storico:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ricerca storica e suggerimenti PDF
        env:
          DAL: ${{ inputs.dal }}
          AL: ${{ inputs.al }}
        run: python scripts/recupero_storico_stampa.py --dal "$DAL" --al "$AL"
      - name: Aggiorna copia locale del catalogo
        run: python -c "import sys,json; sys.path.insert(0,'scripts'); from aggiorna_notizie import salva_snapshot,OUTPUT; salva_snapshot(json.loads(OUTPUT.read_text(encoding='utf-8')))"
      - name: Salva risultati nel repository
        run: |
          git add data/stampa.json js/dati-locali.js
          if ! git diff --cached --quiet; then
            git config user.name 'UDC archivio automatico'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Integra recupero storico rassegna stampa'
            git push
          fi
